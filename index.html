<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>NSSUスキー実習 代替学習プログラム</title>
<meta name="description" content="日本体育大学 スキー実習 代替学習プログラム｜スキー・雪・冬の自然を学ぶ ○×チャレンジ">
<style>
/* Layout: スマホ1カラムのチャット型。上部固定ヘッダー＋本文＋下部固定の回答バー。PCでは中央 640px */
:root{
  --bg:#eef2f0; --surface:#ffffff; --surface-2:#f6f8f7; --line:#d5ddd9;
  --ink:#17231e; --muted:#4f5f58;
  --accent:#137049; --accent-ink:#ffffff; --accent-soft:#e3f2ea;
  --brand:#023894; --brand-soft:#e8edf7;
  --ok:#137049; --ok-soft:#e3f2ea;
  --warn:#8a4b06; --warn-soft:#fdf1e1; --warn-line:#e9c48f;
  --bubble-nav:#ffffff; --bubble-me:#cfe0fb;
  --focus:#1d64d8;
  --red:#d0021b;
  --shadow:0 1px 2px rgba(20,40,30,.08),0 4px 16px rgba(20,40,30,.06);
  --font:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic UI","Meiryo",system-ui,sans-serif;
  --num:ui-monospace,"SF Mono","Roboto Mono",monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#101614; --surface:#18211d; --surface-2:#1e2925; --line:#2f3d37;
  --ink:#e7efea; --muted:#a9b8b1;
  --accent:#3fbf85; --accent-ink:#06170f; --accent-soft:#183326;
  --brand:#8fb0ee; --brand-soft:#1b2540;
  --ok:#5fd39c; --ok-soft:#173326;
  --warn:#f2b46a; --warn-soft:#33240f; --warn-line:#6b4a1d;
  --bubble-nav:#1e2925; --bubble-me:#213a6b;
  --focus:#8ab4ff; --red:#ff6b6b; --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101614; --surface:#18211d; --surface-2:#1e2925; --line:#2f3d37;
  --ink:#e7efea; --muted:#a9b8b1;
  --accent:#3fbf85; --accent-ink:#06170f; --accent-soft:#183326;
  --brand:#8fb0ee; --brand-soft:#1b2540;
  --ok:#5fd39c; --ok-soft:#173326;
  --warn:#f2b46a; --warn-soft:#33240f; --warn-line:#6b4a1d;
  --bubble-nav:#1e2925; --bubble-me:#213a6b;
  --focus:#8ab4ff; --red:#ff6b6b; --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:1.0625rem;line-height:1.8;margin:0}
a{color:var(--accent)}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:6px}
[tabindex="-1"]:focus{outline:none}
h1,h2,h3{line-height:1.45;text-wrap:balance;margin:0}
p{margin:0}
.wrap{max-width:640px;margin:0 auto;padding-inline:16px}
.stack{display:flex;flex-direction:column;gap:16px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:12px;min-height:56px;padding-block:6px}
.logo{height:26px;width:auto;display:block;border-radius:2px}
.top-title{font-size:.82rem;line-height:1.35;color:var(--muted);min-width:0}
.top-title b{display:block;color:var(--ink);font-size:.92rem}
.save{margin-left:auto;font-size:.75rem;line-height:1.3;color:var(--muted);text-align:right;flex-shrink:0;max-width:9.5em}
.save.err{color:var(--warn);font-weight:700}

main{padding-block:20px 32px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px}
.muted{color:var(--muted)}
.small{font-size:.9rem;line-height:1.7}
.eyebrow{font-size:.78rem;letter-spacing:.08em;color:var(--accent);font-weight:700}

/* hero */
.hero{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.crest{width:72px;height:72px;background:#fff;border-radius:18px;display:grid;place-items:center;border:1px solid var(--line)}
.crest img{width:54px;height:auto}
.hero h1{font-size:1.45rem}
.hero .sub{color:var(--muted);font-size:.95rem;margin-top:4px}
.credit{font-size:.82rem;color:var(--muted)}
.notice{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:14px 16px;font-size:.92rem;line-height:1.75}
.notice strong{display:block;margin-bottom:4px}
.warnbox{background:var(--warn-soft);border:1px solid var(--warn-line);color:var(--ink);border-radius:12px;padding:12px 16px;font-size:.92rem}
.warnbox strong{color:var(--warn)}
ul.plain{margin:0;padding-left:1.2em}
ul.plain li+li{margin-top:4px}

/* buttons */
.btn{appearance:none;border:2px solid transparent;border-radius:14px;min-height:56px;padding:10px 18px;font:inherit;font-weight:700;font-size:1.02rem;line-height:1.4;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;width:100%}
.btn-primary{background:var(--accent);color:var(--accent-ink)}
.btn-secondary{background:var(--surface);color:var(--ink);border-color:var(--line)}
.btn-ghost{background:transparent;color:var(--accent);min-height:48px;border-color:transparent;text-decoration:underline;text-underline-offset:3px;width:auto;padding-inline:8px}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn-row{display:flex;flex-direction:column;gap:12px}
.link-btn{display:inline-flex;align-items:center;gap:6px;min-height:44px;color:var(--accent);font-weight:700;font-size:.92rem}

/* form */
label.f{display:flex;flex-direction:column;gap:6px;font-weight:700}
label.f span.h{font-weight:400;font-size:.85rem;color:var(--muted)}
input[type=text],select{font:inherit;font-size:1.0625rem;min-height:52px;padding:8px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);width:100%}
.err-text{color:var(--warn);font-size:.9rem;font-weight:700}

/* pattern cards */
.pgrid{display:grid;gap:14px}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px}
.pcard-h{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.pcard h3{font-size:1.1rem}
.pcard .theme{font-size:.88rem;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 10px;font-size:.8rem;font-weight:700;white-space:nowrap;border:1.5px solid currentColor}
.st-new{color:var(--muted)}
.st-prog{color:var(--brand)}
.st-retry{color:var(--warn);background:var(--warn-soft)}
.st-pass{color:var(--ok);background:var(--ok-soft)}
.meta{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 12px;font-size:.88rem;margin:0}
.meta div{display:flex;justify-content:space-between;gap:8px;border-bottom:1px dashed var(--line);padding-block:2px}
.meta dt{color:var(--muted)} .meta dd{margin:0;font-weight:700;font-variant-numeric:tabular-nums}
.progress-summary{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.dots{display:flex;gap:6px}
.dot{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font-size:.8rem;font-weight:700;border:1.5px solid var(--line);color:var(--muted)}
.dot.pass{background:var(--ok);border-color:var(--ok);color:var(--accent-ink)}

/* quiz */
.qbar{background:var(--surface);border-bottom:1px solid var(--line)}
.qbar .wrap{padding-block:8px 10px;display:flex;flex-direction:column;gap:6px}
.qbar-row{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.qbar-row b{font-size:.95rem}
.qnum{font-variant-numeric:tabular-nums;font-weight:700}
.bar{height:8px;background:var(--surface-2);border:1px solid var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}
.qnote{font-size:.78rem;color:var(--muted);line-height:1.5}
.chat{display:flex;flex-direction:column;gap:14px;padding-block:16px 8px}
.msg{display:flex;gap:10px;align-items:flex-start;max-width:100%}
.msg.me{justify-content:flex-end}
.avatar{width:36px;height:36px;border-radius:50%;background:#fff;border:1px solid var(--line);display:grid;place-items:center;flex-shrink:0}
.avatar img{width:26px}
.bubble{background:var(--bubble-nav);border:1px solid var(--line);border-radius:4px 16px 16px 16px;padding:12px 14px;min-width:0;max-width:calc(100% - 46px);box-shadow:var(--shadow)}
.me .bubble{background:var(--bubble-me);border-color:transparent;border-radius:16px 4px 16px 16px;max-width:85%;box-shadow:none}
.who{font-size:.75rem;color:var(--muted);font-weight:700;margin-bottom:2px}
.qtext{font-size:1.08rem;line-height:1.85;font-weight:500}
.qlabel{display:inline-block;font-size:.78rem;font-weight:700;color:var(--brand);background:var(--brand-soft);border-radius:6px;padding:0 8px;margin-bottom:6px}
.tools{display:flex;flex-direction:column;gap:6px;margin-top:10px;border-top:1px dashed var(--line);padding-top:8px}
details.hint summary{cursor:pointer;min-height:44px;display:flex;align-items:center;font-weight:700;color:var(--accent);font-size:.92rem}
details.hint .hint-body{font-size:.9rem;line-height:1.7;padding-bottom:6px}
.kw{display:inline-block;background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:0 8px;margin:2px 4px 2px 0}
.srcs{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.srcs a{font-weight:700;word-break:break-word}
.srcs .pub{display:block;font-size:.8rem;color:var(--muted);line-height:1.5}
.verdict{display:flex;align-items:center;gap:8px;font-weight:800;font-size:1.05rem}
.verdict .ic{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:.9rem;flex-shrink:0}
.v-ok{color:var(--ok)} .v-ok .ic{background:var(--ok);color:var(--accent-ink)}
.v-ng{color:var(--warn)} .v-ng .ic{background:var(--warn);color:var(--surface)}
.bubble.res-ng{background:var(--warn-soft);border-color:var(--warn-line)}
.bubble.res-ok{background:var(--ok-soft);border-color:transparent}
.point{margin-top:6px;font-size:.95rem}
details.history{background:var(--surface);border:1px solid var(--line);border-radius:12px}
details.history summary{cursor:pointer;padding:10px 14px;min-height:48px;display:flex;align-items:center;font-weight:700;font-size:.92rem;color:var(--muted)}
.hist-list{list-style:none;margin:0;padding:0 14px 12px;display:flex;flex-direction:column;gap:8px}
.hist-list li{font-size:.88rem;line-height:1.6;border-top:1px dashed var(--line);padding-top:8px}
.hist-list .tag{font-weight:700}

.dock{position:sticky;bottom:0;z-index:15;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.dock .wrap{padding-block:10px 12px;display:flex;flex-direction:column;gap:6px}
.dock .lbl{font-size:.8rem;color:var(--muted);text-align:center;line-height:1.4}
.ans{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ans .btn{min-height:64px;border:2px solid var(--brand);background:var(--surface);color:var(--ink);flex-direction:column;gap:0;font-size:1rem}
.ans .btn .sym{font-size:1.6rem;line-height:1;color:var(--brand);font-weight:800}
.ans .btn:active{transform:translateY(1px)}

/* dialog */
dialog{border:none;padding:0;background:var(--surface);color:var(--ink);width:min(640px,100%);max-height:88dvh;border-radius:18px;box-shadow:0 10px 40px rgba(0,0,0,.3)}
dialog::backdrop{background:rgba(10,20,15,.5)}
@media (max-width:700px){dialog{margin:auto 0 0;max-width:100%;border-radius:18px 18px 0 0;max-height:90dvh}}
.dlg{display:flex;flex-direction:column;max-height:inherit}
.dlg-h{display:flex;align-items:center;gap:8px;padding:14px 16px;border-bottom:1px solid var(--line)}
.dlg-h h2{font-size:1.15rem;flex:1}
.x{appearance:none;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);width:44px;height:44px;border-radius:12px;font-size:1.2rem;cursor:pointer;flex-shrink:0}
.dlg-b{overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:14px;overscroll-behavior:contain}
.dlg-f{padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:0;font-size:.95rem}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-weight:700}
.sec h3{font-size:.85rem;color:var(--muted);letter-spacing:.04em;margin-bottom:4px}
.pointbox{background:var(--accent-soft);border-radius:10px;padding:10px 14px}

/* result */
.ng-red{color:var(--red)!important;font-weight:800}
/* 情報入力ボックス・問題ボックスは常に白背景（ダークモードでも） */
.paper{--surface:#ffffff;--surface-2:#f6f8f7;--line:#d5ddd9;--ink:#17231e;--muted:#4f5f58;--accent:#137049;--accent-ink:#ffffff;--brand:#023894;--brand-soft:#e8edf7;--warn:#8a4b06;--focus:#1d64d8;--bubble-nav:#ffffff;
  background:#ffffff!important;color:var(--ink);color-scheme:light}
.paper.paper-yellow{background:#fff8d6!important;--line:#ecdc9a}
.result-head{text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center}
.result-head h2{font-size:1.9rem}
.result-head.pass h2{color:var(--ok)}
.result-head.fail h2{color:var(--warn)}
.score{font-size:2.6rem;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.2}
.score small{font-size:1rem;color:var(--muted);font-weight:700}
.review{display:flex;flex-direction:column;gap:12px;list-style:none;margin:0;padding:0}
.review li{border:1px solid var(--warn-line);background:var(--surface);border-radius:12px;padding:14px}
.review .qline{font-weight:700}
footer.site{padding-block:24px calc(24px + env(safe-area-inset-bottom,0px));font-size:.8rem;color:var(--muted);text-align:center;line-height:1.7}
footer.site img{height:20px;margin:0 auto 6px;display:block}

@media (min-width:560px){.pgrid{grid-template-columns:1fr 1fr}.btn-row.h{flex-direction:row}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
</style>

const QMAP = Object.fromEntries(QUESTIONS.map(q=>[q.id,q]));
const BY_PATTERN = {}; for(const q of QUESTIONS){(BY_PATTERN[q.pattern]??=[]).push(q)}

/* ===== 判定（整数の正解数で判定。丸めた％には依存しない） ===== */
function judge(answeredCount, correctCount){
  if(answeredCount < CONFIG.total) return "in_progress";
  return correctCount >= CONFIG.passCount ? "passed" : "failed";
}
const pct = c => Math.round(c / CONFIG.total * 100);

/* ===== 保存 ===== */
let storageOK = true;
function emptyDB(){return {schema:1, current:null, learners:{}, ui:{screen:"home"}}}
function load(){
  try{ const s = localStorage.getItem(CONFIG.storageKey); if(s){ const d = JSON.parse(s); if(d && d.schema===1) return d; } }
  catch(e){ storageOK = false; }
  return emptyDB();
}
let db = load();
let lastSaved = null;
function save(){
  try{ localStorage.setItem(CONFIG.storageKey, JSON.stringify(db)); storageOK = true; lastSaved = new Date(); }
  catch(e){ storageOK = false; }
  renderSave(); return storageOK;
}
function renderSave(){
  const el = document.getElementById("save");
  if(!storageOK){ el.className="save err"; el.textContent="⚠ 保存できません"; }
  else if(lastSaved){ el.className="save"; el.textContent="この端末に保存済み "+hm(lastSaved); }
  else { el.className="save"; el.textContent="記録はこの端末に保存"; }
}

/* ===== 便利関数 ===== */
function h(tag, attrs, ...kids){
  const el = document.createElement(tag);
  if(attrs) for(const [k,v] of Object.entries(attrs)){
    if(v==null || v===false) continue;
    if(k==="class") el.className=v;
    else if(k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if(k==="html") el.innerHTML=v; // 固定文言のみで使用
    else el.setAttribute(k, v===true?"":v);
  }
  for(const c of kids.flat()){ if(c==null||c===false) continue; el.append(c instanceof Node ? c : document.createTextNode(String(c))); }
  return el;
}
const nowISO = () => new Date().toISOString();
const two = n => String(n).padStart(2,"0");
function hm(d){return two(d.getHours())+":"+two(d.getMinutes())}
function fmt(iso){ if(!iso) return "—"; const d=new Date(iso); return `${d.getFullYear()}/${two(d.getMonth()+1)}/${two(d.getDate())} ${hm(d)}`; }
function uid(){ try{ return crypto.randomUUID(); }catch(e){ return "a-"+Date.now().toString(36)+"-"+Math.random().toString(36).slice(2,10); } }
function announce(t){ const l=document.getElementById("live"); l.textContent=""; setTimeout(()=>l.textContent=t,30); }
const ansLabel = v => v ? "○ 正しい" : "× 誤っている";

/* ===== 学習者・受験データ ===== */
function learner(){ return db.current ? db.learners[db.current] : null; }
function pstate(p){ const L=learner(); L.patterns ??= {}; return (L.patterns[p] ??= {attempts:[], passedAt:null, passedAttemptId:null}); }
function activeAttempt(p){ const a = pstate(p).attempts.at(-1); return a && a.status==="in_progress" ? a : null; }
function completed(p){ return pstate(p).attempts.filter(a=>a.status!=="in_progress"); }
function best(p){ const c=completed(p); return c.length ? c.reduce((m,a)=>a.correctCount>m.correctCount?a:m) : null; }
function patternStatus(p){
  const s=pstate(p), act=activeAttempt(p), last=s.attempts.at(-1);
  if(s.passedAt) return {key:"pass", label:"合格", sub: act ? "再受験中" : null};
  if(act) return {key:"prog", label:"学習中"};
  if(last && last.status==="failed") return {key:"retry", label:"再挑戦が必要"};
  return {key:"new", label:"未開始"};
}
function startAttempt(p){
  const s = pstate(p);
  let order = BY_PATTERN[p].map(q=>q.id);
  if(CONFIG.shuffle){ for(let i=order.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]];} }
  const a = {attemptId:uid(), pattern:p, number:s.attempts.length+1, bankVersion:CONFIG.bankVersion, order,
    answers:{}, pos:0, phase:"answering", answeredCount:0, correctCount:0, status:"in_progress",
    startedAt:nowISO(), updatedAt:nowISO(), completedAt:null};
  s.attempts.push(a); return a;
}

function copyRecord(msgEl){
  const L=learner();
  const lines=[`日本体育大学 スキー実習 代替学習プログラム 学習記録（端末内の記録）`,`学籍番号: ${L.id}`,`氏名: ${L.name}`,`ディビジョン: ${L.division}`,`問題集バージョン: ${CONFIG.bankVersion}`,""];
  for(const p of Object.keys(PATTERNS)){
    const s=pstate(p), b=best(p), c=completed(p), first=c[0], last=c.at(-1);
    lines.push(`${PATTERNS[p].name}: ${s.passedAt?"合格("+fmt(s.passedAt)+")":patternStatus(p).label} / 受験${s.attempts.length}回 / 初回 ${first?first.correctCount+"/20":"—"} / 直近 ${last?last.correctCount+"/20":"—"} / 最高 ${b?b.correctCount+"/20":"—"}`);
  }
  const req=CONFIG.requiredPatterns; lines.push("", `修了: ${req.every(p=>pstate(p).passedAt)?"指定パターンすべて合格":"未修了"}`, `コピー日時: ${fmt(nowISO())}`);
  const text=lines.join("\n");
  const fallback=()=>{ const ta=h("textarea",{readonly:true,rows:10,style:"width:100%;font:inherit;font-size:.85rem"}); ta.value=text; msgEl.replaceChildren("自動コピーできませんでした。下の文字を長押しで選択してコピーしてください。",ta); ta.select(); };
  try{ navigator.clipboard.writeText(text).then(()=>{msgEl.textContent="コピーしました（まだ提出はされていません）。";},fallback); }catch(e){ fallback(); }
}

function answer(val){
  if(busy) return; busy = true;
  try{
    const a = activeAttempt(db.ui.pattern);
    if(!a || a.phase!=="answering") return;
    const qid = a.order[a.pos];
    if(a.answers[qid]) return;            // 最初の回答のみ採点
    const q = QMAP[qid], correct = (val === q.correctAnswer);
    a.answers[qid] = {answer:val, correct, answeredAt:nowISO(), explanationAck:false, ackAt:null};
    a.answeredCount = Object.keys(a.answers).length;
    a.correctCount = Object.values(a.answers).filter(r=>r.correct).length;
    a.phase = correct ? "answered" : "awaiting_ack";
    lockUntil = Date.now() + 800;
    a.updatedAt = nowISO();
    save(); render(false);
    if(correct){ announce("正解です。"+q.learningPoint); document.getElementById("btn-next")?.focus(); }
    else { announce("不正解です。解説を表示します。"); openExplain(a,q,true); }
  } finally { setTimeout(()=>busy=false, 250); }
}
function next(){
  const a = activeAttempt(db.ui.pattern);
  if(!a || a.phase!=="answered" || locked()) return;
  advance(a);
}
function acknowledge(a,q){
  if(a.phase!=="awaiting_ack" || a.order[a.pos]!==q.id || locked()) return;
  const r = a.answers[q.id]; r.explanationAck = true; r.ackAt = nowISO();
  a.phase = "answered"; a.updatedAt = nowISO();
  closeDlg(true);
  advance(a);
}
function advance(a){
  if(a.pos >= CONFIG.total-1){
    a.answeredCount = Object.keys(a.answers).length;
    a.correctCount = Object.values(a.answers).filter(r=>r.correct).length;
    const st = judge(a.answeredCount, a.correctCount);
    if(st==="in_progress") return; // 安全策：未回答があれば確定しない
    a.status = st; a.phase = "done"; a.completedAt = nowISO(); a.updatedAt = a.completedAt;
    const s = pstate(a.pattern);
    if(st==="passed" && !s.passedAt){ s.passedAt = a.completedAt; s.passedAttemptId = a.attemptId; }
    go("result",{pattern:a.pattern, attemptId:a.attemptId});
    announce(st==="passed"?"合格です":"不合格です");
  } else {
    a.pos += 1; a.phase = "answering"; a.updatedAt = nowISO();
    save(); render(true);
    announce(`第${a.pos+1}問`);
  }
}

/* --- 解説ダイアログ --- */
const dlg = document.getElementById("dlg");
let dlgOpener = null;
function closeDlg(silent){ if(dlg.open) dlg.close(); if(!silent && dlgOpener && document.contains(dlgOpener)) dlgOpener.focus(); }
document.getElementById("dlg-x").addEventListener("click",()=>closeDlg());
dlg.addEventListener("cancel",e=>{ e.preventDefault(); closeDlg(); }); // Escでは閉じるだけ（次へ進まない）
let dlgOpenedAt = 0;
dlg.addEventListener("click",e=>{ if(e.target===dlg && Date.now()-dlgOpenedAt>700) closeDlg(); }); // 連打で即閉じしない
function openExplain(a,q,needAck){
  dlgOpener = document.activeElement;
  const r = a.answers[q.id];
  const isLast = a.order.indexOf(q.id) === CONFIG.total-1;
  const dt = document.getElementById("dlg-title"); dt.classList.toggle("ng-red", !!(r && !r.correct)); dt.textContent = r ? (r.correct ? "正解です｜解説" : "不正解です") : "解説";
  const b = document.getElementById("dlg-b"); b.replaceChildren(
    h("p",{class:"muted small"},`${PATTERNS[a.pattern].name} 第${a.order.indexOf(q.id)+1}問`),
    h("p",{style:"font-weight:700"},q.statement),
    r ? h("dl",{class:"kv"},h("dt",null,"あなたの回答"),h("dd",null,ansLabel(r.answer)),h("dt",null,"正しい回答"),h("dd",{style:"color:var(--ok)"},ansLabel(q.correctAnswer))) : null,
    h("div",{class:"sec"},h("h3",null,"解説"),h("p",null,`正解は「${q.correctAnswer?"○":"×"}」です。`,q.explanation)),
    h("div",{class:"sec pointbox"},h("h3",null,"覚えておきたいポイント"),h("p",null,q.learningPoint)),
    h("div",{class:"sec"},h("h3",null,"参考資料"),sourceList(q)));
  const f = document.getElementById("dlg-f");
  if(needAck && a.phase==="awaiting_ack"){
    f.replaceChildren(h("button",{class:"btn btn-primary",type:"button",id:"dlg-ack",onclick:()=>acknowledge(a,q)}, isLast?"解説を確認して結果へ":"解説を確認して次へ"));
  } else {
    f.replaceChildren(h("button",{class:"btn btn-secondary",type:"button",onclick:()=>closeDlg()},"閉じる"));
  }
  b.scrollTop = 0;
  if(!dlg.open){ dlg.showModal(); dlgOpenedAt = Date.now(); }
  document.getElementById("dlg-title").setAttribute("tabindex","-1");
  document.getElementById("dlg-title").focus();
}

/* --- 結果 --- */
function vResult(){
  const p = db.ui.pattern, s = pstate(p);
  const a = s.attempts.find(x=>x.attemptId===db.ui.attemptId) || completed(p).at(-1);
  if(!a || a.status==="in_progress"){ db.ui={screen:"patterns"}; return vPatterns(); }
  const pass = a.status==="passed";
  const wrong = a.order.filter(id=>!a.answers[id]?.correct).map(id=>QMAP[id]);
  const b = best(p);
  const reqLeft = CONFIG.requiredPatterns.filter(x=>!pstate(x).passedAt);
  const nextP = reqLeft.find(x=>x!==p);
  const usedSrc = [...new Set(a.order.flatMap(id=>QMAP[id].sources.map(r=>r.src)))];
  return h("main",{class:"wrap stack"},
    h("section",{class:"card result-head "+(pass?"pass":"fail")},
      h("p",{class:"eyebrow"},`${PATTERNS[p].name}｜${PATTERNS[p].theme}`),
      h("h2",{"data-focus":""},pass?"合格です":"不合格です"),
      h("p",{class:"score"},a.correctCount,h("small",null," / 20問 正解")),
      h("p",{style:"font-weight:700"},`正答率 ${pct(a.correctCount)}％`),
      h("p",null, pass ? "20問中18問以上に正解しました。"
        : `今回の正答率は${pct(a.correctCount)}％でした。合格には18問以上の正解が必要です。解説を確認し、第1問からもう一度取り組んでください。`)),
    !pass && !activeAttempt(p) ? h("button",{class:"btn btn-primary",type:"button",onclick:()=>{ startAttempt(p); go("quiz",{pattern:p}); }},"第1問から再挑戦") : null,
    !pass && activeAttempt(p) ? h("button",{class:"btn btn-primary",type:"button",onclick:()=>go("quiz",{pattern:p})},"再挑戦の続きへ") : null,
    pass && nextP ? h("button",{class:"btn btn-primary",type:"button",onclick:()=>go("guide",{pattern:nextP})},`次の課題（${PATTERNS[nextP].name}）へ`) : null,
    h("button",{class:"btn btn-secondary",type:"button",onclick:()=>go("patterns")},"パターン一覧へ"),
    h("section",{class:"card"},
      h("dl",{class:"kv"},
        h("dt",null,"受験回数"),h("dd",null,`第${a.number}回（このパターン通算 ${s.attempts.length}回）`),
        h("dt",null,"完了日時"),h("dd",null,fmt(a.completedAt)),
        h("dt",null,"合格実績"),h("dd",null,s.passedAt?`合格済み（${fmt(s.passedAt)}）`:"まだありません"),
        h("dt",null,"最高結果"),h("dd",null,b?`${b.correctCount}/20問（${pct(b.correctCount)}％）`:"—"),
        h("dt",null,"解説確認"),h("dd",null,`不正解 ${wrong.length}問の解説を確認済み`))),
    !pass && s.passedAt ? h("p",{class:"notice small"},"このパターンは以前に合格しています。今回の結果で合格の記録が取り消されることはありません。") : null,
    h("section",{class:"stack"},
      h("h3",{style:"font-size:1.05rem"},wrong.length?`間違えた問題の復習（${wrong.length}問）`:"全問正解です"),
      wrong.length ? h("ol",{class:"review"}, wrong.map(q=>{const r=a.answers[q.id]; return h("li",{class:"stack",style:"gap:8px"},
        h("p",{class:"qline"},`第${a.order.indexOf(q.id)+1}問　${q.statement}`),
        h("p",{class:"small"},`あなたの回答：${ansLabel(r.answer)}　→　正しい回答：${ansLabel(q.correctAnswer)}`),
        h("p",{class:"small"},q.explanation),
        h("p",{class:"small pointbox"},"ポイント：",q.learningPoint),
        sourceList(q));})) : null),
    h("section",{class:"card stack"},h("h3",{style:"font-size:1rem"},"このパターンの参考資料"),
      h("ul",{class:"srcs"},usedSrc.map(k=>h("li",null,h("a",{href:SOURCES[k].url,target:"_blank",rel:"noopener noreferrer"},SOURCES[k].title+" ↗"),h("span",{class:"pub"},SOURCES[k].publisher))))),
    h("p",{class:"notice small"},DISCLAIMER));
}

/* ===== 起動・復元 ===== */
if(!storageOK){ /* 保存不可でも学習は可能（メモリ上） */ }
renderSave();
render(true);
// 解説確認待ちで再読み込みした場合は解説を再表示
(function restore(){
  if(db.ui.screen!=="quiz" || !learner()) return;
  const a = activeAttempt(db.ui.pattern); if(!a) return;
  if(a.phase==="awaiting_ack") openExplain(a, QMAP[a.order[a.pos]], true);
})();
// 他のタブから戻ったときは最新の保存内容を読み直す
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible" && !dlg.open){ const d=load(); if(d && JSON.stringify(d)!==JSON.stringify(db)){ db=d; render(false);} } });
window.__test = {judge, CONFIG, QUESTIONS};
</script>
